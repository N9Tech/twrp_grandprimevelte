name: TWRP 3.2 Compiler (Omni 6.0) - grandprimevelte

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Type de build (eng / userdebug)"
        required: true
        default: "eng"

env:
  MANIFEST_URL: https://github.com
  MANIFEST_BRANCH: twrp-6.0
  DEVICE_VENDOR: samsung
  DEVICE_CODENAME: grandprimevelte
  DEVICE_PATH: device/samsung/grandprimevelte
  TARGET_IMAGE: recoveryimage

jobs:
  build:
    name: Compiler recovery.img
    runs-on: ubuntu-20.04
    timeout-minutes: 360

    steps:
      - name: Récupérer le dépôt (contient device/samsung/grandprimevelte)
        uses: actions/checkout@v4
        with:
          path: local_repo

      - name: Exécuter la compilation dans le conteneur d'époque
        uses: docker://ubuntu:18.04
        with:
          args: |
            bash -c "
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends \
              bc bison build-essential ca-certificates ccache curl flex g++-multilib gcc-multilib \
              git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool \
              libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop \
              m4 make openjdk-8-jdk pngcrush python python3 rsync schedtool squashfs-tools \
              sudo unzip wget xsltproc zip zlib1g-dev
            
            update-alternatives --set java /usr/lib/jvm/java-8-openjdk-amd64/jre/bin/java
            update-alternatives --set javac /usr/lib/jvm/java-8-openjdk-amd64/bin/javac
            
            mkdir -p /usr/local/bin
            curl -fsSL https://googleapis.com -o /usr/local/bin/repo
            chmod a+x /usr/local/bin/repo
            
            git config --global user.name 'GitHub Actions'
            git config --global user.email 'actions@github.com'
            git config --global color.ui false
            
            echo 'Vérification de l'emplacement du Device Tree...'
            if [ -d 'local_repo/${{ env.DEVICE_PATH }}' ]; then
              echo 'Device tree trouvé dans la racine du dépôt.'
              export ACTUAL_TREE_PATH='local_repo/${{ env.DEVICE_PATH }}'
            elif [ -d 'local_repo/g531F/${{ env.DEVICE_PATH }}' ]; then
              echo 'Device tree trouvé à l'intérieur du sous-dossier g531F.'
              export ACTUAL_TREE_PATH='local_repo/g531F/${{ env.DEVICE_PATH }}'
            elif [ -d 'local_repo/g531f/${{ env.DEVICE_PATH }}' ]; then
              echo 'Device tree trouvé à l'intérieur du sous-dossier g531f.'
              export ACTUAL_TREE_PATH='local_repo/g531f/${{ env.DEVICE_PATH }}'
            else
              echo '::error::Le dossier ${{ env.DEVICE_PATH }} est introuvable sur votre dépôt GitHub.'
              exit 1
            fi
            
            mkdir -p omni
            cd omni
            repo init --depth=1 -u ${{ env.MANIFEST_URL }} -b ${{ env.MANIFEST_BRANCH }}
            repo sync -c -j\$(nproc --all) --force-sync --no-clone-bundle --no-tags
            
            mkdir -p ${{ env.DEVICE_PATH }}
            cp -r ../\$ACTUAL_TREE_PATH/. ${{ env.DEVICE_PATH }}/
            
            export LC_ALL=C
            export ALLOW_MISSING_DEPENDENCIES=true
            
            source build/envsetup.sh
            lunch omni_${{ env.DEVICE_CODENAME }}-${{ github.event.inputs.build_type }}
            make clean
            make -j\$(nproc --all) ${{ env.TARGET_IMAGE }} 2>&1 | tee build.log
            "

      - name: Publier l'image recovery.img
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-3.2-${{ env.DEVICE_CODENAME }}-recovery
          path: |
            omni/out/target/product/${{ env.DEVICE_CODENAME }}/recovery.img
            omni/out/target/product/${{ env.DEVICE_CODENAME }}/recovery.img.md5

      - name: Publier le journal de compilation (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ env.DEVICE_CODENAME }}
          path: omni/build.log
          if-no-files-found: ignore
